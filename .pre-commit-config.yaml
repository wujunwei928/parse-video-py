repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: check-yaml
  - id: debug-statements
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/PyCQA/isort
  rev: 5.12.0
  hooks:
    - id: isort
      args:
          - '--profile=black' # 防止和black冲突 https://github.com/PyCQA/isort/issues/1518
          - '--line-length=88'
- repo: https://github.com/psf/black
  rev: 23.7.0
  hooks:
    - id: black
      args:
          - '--line-length=88'
- repo: https://github.com/PyCQA/flake8
  rev: 6.1.0
  hooks:
    - id: flake8
      exclude: scrapy_spider/settings.py
      args:
          - '--max-line-length=88'
- repo: https://github.com/gitleaks/gitleaks
  rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
  hooks:
    - id: gitleaks
      stages: [pre-commit]
- repo: https://github.com/PyCQA/bandit
  rev: 1.9.4
  hooks:
    - id: bandit
      args: ["-c", "pyproject.toml"]
      additional_dependencies: ["bandit[toml]"]
- repo: https://github.com/pypa/pip-audit
  rev: v2.9.0
  hooks:
    # manual 阶段：遗留 requirements.txt 锁有带已知 CVE 的旧版本（starlette/Jinja2/python-multipart），
    # 刷新该文件后可提升为 pre-commit 阶段（pre-commit run pip-audit --all-files 手动执行）
    - id: pip-audit
      args: ["-r", "requirements.txt"]
      stages: [manual]
- repo: local
  hooks:
    - id: pytest
      name: pytest
      entry: pytest
      language: system
      pass_filenames: false
      args:
        - tests/
        - -v
        - --tb=short

ci:
  # pre-commit.ci 不允许网络调用，pip-audit 仅本地运行
  skip: [pip-audit]
